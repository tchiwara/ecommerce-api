spring:
  application:
    name: ecommerce.api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

  flyway:
    enabled: true

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 3600
    refreshTokenExpiration: 604800

  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  data:
    redis:
      host: localhost
      port: 6379

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  success-url: ${STRIPE_SUCCESS_URL}
  cancel-url: ${STRIPE_CANCEL_URL}
  currency: ${STRIPE_CURRENCY:usd}

app:
  otp:
    secret: ${OTP_SECRET}
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
    hourly-limit: 5

  rate-limit:
    enabled: true
    key-prefix: "ecom:rl:"
    window-seconds: 60
    trusted-proxy: false

    strict:
      login-limit: 10
      registration-limit: 5
      otp-send-limit: 5
      otp-verify-limit: 10

    moderate:
      authenticated-limit: 120

    loose:
      public-get-limit: 300